name: lamb-kafka-prod

# Broker de eventos para produccion local, en la red compartida lamb-prod-net.
services:
  lamb-kafka:
    image: apache/kafka:4.1.0
    container_name: lamb-kafka
    restart: unless-stopped
    ports:
      - "28092:28092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:28092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://lamb-kafka:9092,EXTERNAL://localhost:28092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@lamb-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - lamb-prod-net

  lamb-kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: lamb-kafka-ui
    restart: unless-stopped
    depends_on:
      lamb-kafka:
        condition: service_healthy
    ports:
      - "28090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lamb-prod
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: lamb-kafka:9092
    networks:
      - lamb-prod-net

networks:
  lamb-prod-net:
    external: true
