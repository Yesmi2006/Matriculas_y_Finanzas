server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://lamb-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: lamb-personas-ms
    static_configs:
      - targets: [localhost]
        labels:
          application: lamb-personas-ms
          __path__: /var/log/lamb/lamb-personas-ms/logs/*.log

  - job_name: lamb-institucional-ms
