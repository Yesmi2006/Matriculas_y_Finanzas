name: lamb-obs-prod

services:
  lamb-prometheus:
    image: prom/prometheus:v3.14.0
    container_name: lamb-prometheus
    restart: unless-stopped
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - lamb-prod-net

  lamb-loki:
    image: grafana/loki:3.7.6
    container_name: lamb-loki
    restart: unless-stopped
    ports:
      - "23100:3100"
    networks:
      - lamb-prod-net

  lamb-promtail:
    image: grafana/promtail:3.6.8
    container_name: lamb-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../services:/var/log/lamb:ro
      - ../infra/lamb-gateway/logs:/var/log/lamb-gateway:ro
      - ../keycloak/logs:/var/log/lamb-keycloak:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - lamb-loki
    networks:
      - lamb-prod-net

  lamb-grafana:
    image: grafana/grafana:11.4.0
    container_name: lamb-grafana
    restart: unless-stopped
    ports:
      - "23000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - lamb-prometheus
      - lamb-loki
    networks:
      - lamb-prod-net

networks:
  lamb-prod-net:
    external: true
