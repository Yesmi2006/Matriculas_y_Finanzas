name: lamb-obs-dev

services:
  lamb-prometheus:
    image: prom/prometheus:v3.14.0
    container_name: lamb-prometheus-dev
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lamb-loki:
    image: grafana/loki:3.7.6
    container_name: lamb-loki-dev
    restart: unless-stopped
    ports:
      - "13100:3100"

  lamb-promtail:
    image: grafana/promtail:3.6.8
    container_name: lamb-promtail-dev
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config-dev.yml:/etc/promtail/config.yml:ro
      - ../services:/var/log/lamb:ro
      - ../infra/lamb-gateway/logs:/var/log/lamb-gateway:ro
      - ../keycloak/logs:/var/log/lamb-keycloak:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - lamb-loki

  lamb-grafana:
    image: grafana/grafana:11.4.0
    container_name: lamb-grafana-dev
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - lamb-prometheus
      - lamb-loki
