name: lamb-infra-prod

services:
  lamb-config:
    build:
      context: ./lamb-config
      dockerfile: Dockerfile
    container_name: lamb-config
    restart: unless-stopped
    ports:
      - "28888:8888"
    volumes:
      - ./lamb-config/config-repo:/config-repo
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - lamb-prod-net

  lamb-eureka:
    build:
      context: ./lamb-eureka
      dockerfile: Dockerfile
    container_name: lamb-eureka
    restart: unless-stopped
    depends_on:
      lamb-config:
        condition: service_healthy
    ports:
      - "28761:8761"
    environment:
      SERVER_PORT: 8761
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://lamb-config:8888
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8761' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - lamb-prod-net

  lamb-gateway:
    build:
      context: ./lamb-gateway
      dockerfile: Dockerfile
    container_name: lamb-gateway
    restart: unless-stopped
    depends_on:
      lamb-config:
        condition: service_healthy
      lamb-eureka:
        condition: service_healthy
    ports:
      - "28080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://lamb-config:8888
    networks:
      - lamb-prod-net

networks:
  lamb-prod-net:
    name: lamb-prod-net
