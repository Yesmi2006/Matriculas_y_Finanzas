name: lamb-finanzas-prod

services:
  postgres-finanzas:
    image: postgres:16-alpine
    container_name: lamb-postgres-finanzas
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - lamb_finanzas_data:/var/lib/postgresql/data
    ports:
      - "25457:5432"
    networks:
      - lamb-finanzas-int

  lamb-finanzas-ms:
    build: .
    restart: unless-stopped
    depends_on:
      postgres-finanzas:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DB_HOST: lamb-postgres-finanzas
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./logs:/app/logs
    networks:
      - lamb-finanzas-int
      - lamb-prod-net

volumes:
  lamb_finanzas_data:

networks:
  lamb-finanzas-int:
    name: lamb-finanzas-int
  lamb-prod-net:
    external: true
